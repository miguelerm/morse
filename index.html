<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="./icons/icon-32.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c7be5">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traductor a Código Morse con Fichas</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div class="app">
    <h1>Traductor a código Morse</h1>

    <textarea id="inputText" placeholder="Escribe aquí tu mensaje..."></textarea>


    <div class="button-row">
      <button id="btnTranslate">Traducir</button>
      <button id="btnClear" class="btn-clear">Limpiar</button>
      <button id="btnDarkMode" class="btn-dark">Modo oscuro</button>
      <button id="btnPlay" class="btn-play">Escuchar Morse</button>
    </div>

    <div id="tilesContainer" class="tiles-container tiles-margin"></div>
  </div>

  <script src="index.js"></script>
  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
  </script>
</body>
</html>
